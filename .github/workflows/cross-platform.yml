name: Cross-Platform Build Matrix

on:
  workflow_call:

jobs:
  matrix-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v4

    # -----------------------------------------------------------
    # MACOS DEPENDENCIES (Homebrew)
    # -----------------------------------------------------------
    - name: macOS - Install Dependencies
      if: matrix.platform == 'macos'
      run: |
        brew install ninja sdl3 sdl3_image sdl3_ttf

    # -----------------------------------------------------------
    # WINDOWS DEPENDENCIES (vcpkg with actions cache)
    # -----------------------------------------------------------
    - name: Windows - Setup vcpkg Cache
      if: matrix.platform == 'windows'
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/Users/runneradmin/AppData/Local/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-sdl3-v1

    - name: Windows - Install SDL3 Ports
      if: matrix.platform == 'windows'
      run: |
        vcpkg install sdl3:x64-windows sdl3-image:x64-windows sdl3-ttf:x64-windows

    # -----------------------------------------------------------
    # CONFIGURE CMAKE
    # -----------------------------------------------------------
    - name: macOS - Configure CMake
      if: matrix.platform == 'macos'
      run: >
        cmake -B build
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_PREFIX_PATH="$(brew --prefix)"
        -DBUILD_TESTING=ON

    - name: Windows - Configure CMake
      if: matrix.platform == 'windows'
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows
        -DBUILD_TESTING=ON

    # -----------------------------------------------------------
    # BUILD & TEST
    # -----------------------------------------------------------
    - name: Build Project
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Run Tests
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure
